<!-- Soft module icon of PDF Signer for the desk dock and the sidebar header. It follows the soft
     icons of Frappe (module-icons.svg): a stroke in the colour of its holder, a tinted body and a
     lighter accent line. It is the app icon (images/esign.png) on the 24 grid: a document with
     text lines and a signature, and the pen that signs it. -->

