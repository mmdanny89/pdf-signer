		<path d="M6 18c.9-1.9 1.8-2.4 2-1.4.2 1-.7 2 .3 1.7.8-.3 1.2-1.3 1.9-.8" class="soft-accent-line"/>
		<path d="m12.25 17.75.5-3.25 6.5-9.5a1.6 1.6 0 0 1 2.65 1.8l-6.5 9.5Z" class="soft-layer"/>
